# Demo workload with a deliberate typo in the image name: "tset-app" instead of "test-app".
# The agent should detect ImagePullBackOff, verify the corrected image exists in ACR and patch the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: ${MANAGED_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: "${ACR_LOGIN_SERVER}/tset-app:1.4.2"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 80
